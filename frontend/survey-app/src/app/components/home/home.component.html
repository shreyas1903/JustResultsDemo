<!-- Template for the home page with welcome message and navigation cards -->
<!-- Done by Shreyas Patil -->
<div class="container my-5">
    <div class="header-box">
      <h1><i class="fas fa-university me-2"></i>GMU CS Department Survey</h1>
    </div>
    
    <div class="greeting-box mb-4">
      <div id="greeting">Welcome to SWE642 Survey Application</div>
    </div>
    
    <div class="row mt-5">
      <div class="col-md-6 mb-4">
        <div class="card h-100">
          <div class="card-body text-center">
            <h3 class="card-title"><i class="fas fa-clipboard-list me-2"></i>Student Survey</h3>
            <p class="card-text">Fill out a survey to provide feedback about your campus visit.</p>
            <a routerLink="/survey" class="btn btn-primary">
              <i class="fas fa-paper-plane me-2"></i>Complete Survey
            </a>
          </div>
        </div>
      </div>
      <div class="col-md-6 mb-4">
        <div class="card h-100">
          <div class="card-body text-center">
            <h3 class="card-title"><i class="fas fa-list-alt me-2"></i>All Surveys</h3>
            <p class="card-text">View and manage all submitted surveys.</p>
            <a routerLink="/surveys" class="btn btn-primary">
              <i class="fas fa-table me-2"></i>View All Surveys
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
